<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a20" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1445" />
      <stop offset="100%" stop-color="#180b29" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)" rx="12" />

  <rect x="30" y="25" width="310" height="34" rx="8" fill="#e11d48" fill-opacity="0.1" stroke="#e11d48" stroke-width="1" />
  <text x="45" y="47" fill="#fb7185" font-family="monospace" font-size="13" font-weight="bold">VIRTUALIZATION: PROXMOX VE CLOUD</text>

  <!-- Hardware Host Server -->
  <g transform="translate(80, 100)">
    <rect width="640" height="300" rx="14" fill="url(#box-grad)" stroke="#a855f7" stroke-width="2" />
    <text x="25" y="35" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="bold">Physical Baremetal Node (Dell PowerEdge R730 / Lab Host)</text>
    <text x="25" y="55" fill="#94a3b8" font-family="monospace" font-size="11">Proxmox VE 8.2 | Linux Kernel 6.8 | ZFS Pool Mirror</text>
  </g>

  <!-- Virtual Switch Linux Bridge -->
  <g transform="translate(110, 180)">
    <rect width="580" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="25" fill="#38bdf8" font-family="monospace" font-size="11">Virtual Switch: vmbr0 (VLAN Aware Bridge) &lt;--&gt; Trunk Uplink (eno1)</text>
  </g>

  <!-- Guest 1: VM Debian LEMP -->
  <g transform="translate(120, 240)">
    <rect width="165" height="130" rx="8" fill="#09182b" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="28" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">VM 101: Web Server</text>
    <text x="15" y="50" fill="#94a3b8" font-family="monospace" font-size="9">Debian 12 + LEMP</text>
    <text x="15" y="70" fill="#94a3b8" font-family="monospace" font-size="9">vCPU: 4 | RAM: 8GB</text>
    <text x="15" y="90" fill="#38bdf8" font-family="monospace" font-size="9">IP: 192.168.30.10</text>
    <text x="15" y="110" fill="#10b981" font-family="monospace" font-size="8">[VLAN 30 Tagged]</text>
  </g>

  <!-- Guest 2: VM MikroTik CHR -->
  <g transform="translate(315, 240)">
    <rect width="165" height="130" rx="8" fill="#1c0f24" stroke="#f43f5e" stroke-width="1.5" />
    <text x="15" y="28" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold">VM 102: Virtual CHR</text>
    <text x="15" y="50" fill="#94a3b8" font-family="monospace" font-size="9">MikroTik RouterOS 7</text>
    <text x="15" y="70" fill="#94a3b8" font-family="monospace" font-size="9">vCPU: 2 | RAM: 1GB</text>
    <text x="15" y="90" fill="#38bdf8" font-family="monospace" font-size="9">Core Virtual Router</text>
    <text x="15" y="110" fill="#f43f5e" font-family="monospace" font-size="8">[Multi-VIF Bridge]</text>
  </g>

  <!-- Guest 3: LXC Container -->
  <g transform="translate(510, 240)">
    <rect width="165" height="130" rx="8" fill="#1b1d0c" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="28" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">CT 201: DNS BIND9</text>
    <text x="15" y="50" fill="#94a3b8" font-family="monospace" font-size="9">LXC Lightweight</text>
    <text x="15" y="70" fill="#94a3b8" font-family="monospace" font-size="9">vCPU: 1 | RAM: 512MB</text>
    <text x="15" y="90" fill="#38bdf8" font-family="monospace" font-size="9">Authoritative DNS</text>
    <text x="15" y="110" fill="#f59e0b" font-family="monospace" font-size="8">[Instant Boot &lt; 2s]</text>
  </g>
</svg>
