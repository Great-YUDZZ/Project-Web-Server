<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180a0a" />
      <stop offset="100%" stop-color="#05050a" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1212" />
      <stop offset="100%" stop-color="#140b12" />
    </linearGradient>
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)" rx="12" />

  <rect x="30" y="25" width="310" height="34" rx="8" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-width="1" />
  <text x="45" y="47" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="bold">TOPOLOGY: MIKROTIK FIREWALL &amp; QUEUE</text>

  <!-- Internet Cloud -->
  <g transform="translate(60, 190)">
    <rect width="130" height="80" rx="12" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="25" y="38" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">ISP WAN</text>
    <text x="25" y="58" fill="#94a3b8" font-family="monospace" font-size="10">Public IP / NAT</text>
  </g>

  <!-- Connector ISP -> Router -->
  <line x1="190" y1="230" x2="270" y2="230" stroke="#f43f5e" stroke-width="3" />
  <polygon points="270,225 280,230 270,235" fill="#f43f5e" />
  <text x="200" y="220" fill="#f43f5e" font-family="monospace" font-size="10">ether1 (WAN)</text>

  <!-- MikroTik Core Router -->
  <g transform="translate(280, 140)">
    <rect width="190" height="180" rx="14" fill="url(#box-grad)" stroke="#f43f5e" stroke-width="2" filter="url(#glow-rose)" />
    <text x="20" y="35" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">MikroTik RouterOS</text>
    <text x="20" y="60" fill="#f43f5e" font-family="monospace" font-size="10">● RAW: SYN Flood Drop</text>
    <text x="20" y="80" fill="#fb7185" font-family="monospace" font-size="10">● FILTER: Port Scan Block</text>
    <text x="20" y="100" fill="#fb923c" font-family="monospace" font-size="10">● MANGLE: Traffic Marker</text>
    <text x="20" y="120" fill="#a855f7" font-family="monospace" font-size="10">● QUEUE TREE: HTB Prioritize</text>
    <text x="20" y="145" fill="#10b981" font-family="monospace" font-size="10">● NAT: Masquerade Out</text>
  </g>

  <!-- Lines from Router to Queues -->
  <line x1="470" y1="200" x2="550" y2="150" stroke="#10b981" stroke-width="2" />
  <line x1="470" y1="230" x2="550" y2="230" stroke="#38bdf8" stroke-width="2" />
  <line x1="470" y1="260" x2="550" y2="310" stroke="#f59e0b" stroke-width="2" />

  <!-- Queue 1: Priority 1 (UNBK / CBT) -->
  <g transform="translate(550, 120)">
    <rect width="190" height="60" rx="8" fill="#0f291e" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="27" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">Priority 1: CBT / UNBK</text>
    <text x="15" y="45" fill="#a7f3d0" font-family="monospace" font-size="9">CIR: 50 Mbps | Latency: &lt;2ms</text>
  </g>

  <!-- Queue 2: Priority 4 (Browsing Guru/Admin) -->
  <g transform="translate(550, 200)">
    <rect width="190" height="60" rx="8" fill="#0c2338" stroke="#38bdf8" stroke-width="1.5" />
    <text x="15" y="27" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Priority 4: Guru / Web</text>
    <text x="15" y="45" fill="#bae6fd" font-family="monospace" font-size="9">CIR: 30 Mbps | PCQ Balanced</text>
  </g>

  <!-- Queue 3: Priority 8 (Siswa / Streaming) -->
  <g transform="translate(550, 280)">
    <rect width="190" height="60" rx="8" fill="#2d1c08" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="27" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Priority 8: Siswa Hotspot</text>
    <text x="15" y="45" fill="#fde68a" font-family="monospace" font-size="9">MIR: 20 Mbps (Throttled)</text>
  </g>
</svg>
