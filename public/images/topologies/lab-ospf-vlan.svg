<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)" rx="12" />
  
  <!-- Grid lines -->
  <g opacity="0.12" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Title Badge -->
  <rect x="30" y="25" width="280" height="34" rx="8" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1" />
  <text x="45" y="47" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold">TOPOLOGY: DUAL-CORE OSPF &amp; VLAN</text>

  <!-- Connectors -->
  <line x1="250" y1="140" x2="550" y2="140" stroke="#00f0ff" stroke-width="3" stroke-dasharray="6,4" />
  <text x="360" y="130" fill="#38bdf8" font-family="monospace" font-size="11">OSPF Backbone /30</text>

  <line x1="250" y1="140" x2="250" y2="260" stroke="#38bdf8" stroke-width="2" />
  <line x1="550" y1="140" x2="550" y2="260" stroke="#38bdf8" stroke-width="2" />
  <line x1="250" y1="260" x2="550" y2="260" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,4" />
  <text x="375" y="275" fill="#94a3b8" font-family="monospace" font-size="11">Trunk 802.1Q</text>

  <line x1="250" y1="260" x2="150" y2="360" stroke="#10b981" stroke-width="2" />
  <line x1="250" y1="260" x2="300" y2="360" stroke="#10b981" stroke-width="2" />
  <line x1="550" y1="260" x2="500" y2="360" stroke="#a855f7" stroke-width="2" />
  <line x1="550" y1="260" x2="650" y2="360" stroke="#f59e0b" stroke-width="2" />

  <!-- Core Router 1 -->
  <g transform="translate(180, 100)">
    <rect width="140" height="70" rx="10" fill="url(#card-grad)" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <circle cx="25" cy="35" r="10" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1.5" />
    <text x="45" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Core-R1 (MikroTik)</text>
    <text x="45" y="48" fill="#38bdf8" font-family="monospace" font-size="10">10.10.10.1/30</text>
  </g>

  <!-- Core Router 2 -->
  <g transform="translate(480, 100)">
    <rect width="140" height="70" rx="10" fill="url(#card-grad)" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <circle cx="25" cy="35" r="10" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1.5" />
    <text x="45" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Core-R2 (MikroTik)</text>
    <text x="45" y="48" fill="#38bdf8" font-family="monospace" font-size="10">10.10.10.2/30</text>
  </g>

  <!-- Distribution Switch 1 -->
  <g transform="translate(180, 230)">
    <rect width="140" height="60" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="18" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Dist-SW1 (Cisco 2960)</text>
    <text x="18" y="44" fill="#94a3b8" font-family="monospace" font-size="9">VLAN 10, 20 Active</text>
  </g>

  <!-- Distribution Switch 2 -->
  <g transform="translate(480, 230)">
    <rect width="140" height="60" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="18" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Dist-SW2 (Cisco 2960)</text>
    <text x="18" y="44" fill="#94a3b8" font-family="monospace" font-size="9">VLAN 30, 40 Active</text>
  </g>

  <!-- End Devices / Subnets -->
  <g transform="translate(90, 340)">
    <rect width="115" height="50" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="12" y="22" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">VLAN 10 (Admin)</text>
    <text x="12" y="38" fill="#94a3b8" font-family="monospace" font-size="9">192.168.10.0/24</text>
  </g>

  <g transform="translate(240, 340)">
    <rect width="115" height="50" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="12" y="22" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">VLAN 20 (Guru)</text>
    <text x="12" y="38" fill="#94a3b8" font-family="monospace" font-size="9">192.168.20.0/24</text>
  </g>

  <g transform="translate(440, 340)">
    <rect width="115" height="50" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="12" y="22" fill="#a855f7" font-family="sans-serif" font-size="10" font-weight="bold">VLAN 30 (Lab TKJ)</text>
    <text x="12" y="38" fill="#94a3b8" font-family="monospace" font-size="9">192.168.30.0/24</text>
  </g>

  <g transform="translate(595, 340)">
    <rect width="115" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="12" y="22" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold">VLAN 40 (Hotspot)</text>
    <text x="12" y="38" fill="#94a3b8" font-family="monospace" font-size="9">172.16.0.0/22</text>
  </g>
</svg>
