<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" class="w-full h-full">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pramanaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C382E"/>
      <stop offset="100%" stop-color="#051C17"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Core Amber Glow -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Terminal Circuit Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal Cyber Ring (Security & Network Node) -->
  <path d="M60 6 L106 32.5 V87.5 L60 114 L14 87.5 V32.5 Z" 
        fill="url(#pramanaBg)" 
        stroke="url(#emeraldStroke)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Inner Concentric Circuit Ring -->
  <path d="M60 16 L97 37.5 V82.5 L60 104 L23 82.5 V37.5 Z" 
        fill="#07241E" 
        fill-opacity="0.85" 
        stroke="#10B981" 
        stroke-width="1" 
        stroke-dasharray="4 2" 
        stroke-opacity="0.5"/>

  <!-- Network Circuit Lines & Geometric Nodes (TKJ & Linux Backbone) -->
  <g stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="60" y1="16" x2="60" y2="35"/>
    <line x1="97" y1="82.5" x2="78" y2="72"/>
    <line x1="23" y1="82.5" x2="42" y2="72"/>
    <line x1="23" y1="37.5" x2="42" y2="48"/>
    <line x1="97" y1="37.5" x2="78" y2="48"/>
  </g>

  <!-- Node Dots -->
  <circle cx="60" cy="16" r="2.5" fill="#34D399"/>
  <circle cx="97" cy="37.5" r="2.5" fill="#34D399"/>
  <circle cx="97" cy="82.5" r="2.5" fill="#34D399"/>
  <circle cx="60" cy="104" r="2.5" fill="#34D399"/>
  <circle cx="23" cy="82.5" r="2.5" fill="#34D399"/>
  <circle cx="23" cy="37.5" r="2.5" fill="#34D399"/>

  <!-- Central Intelligence Core: Terminal Linux Prompt & Microchip Nexus -->
  <rect x="36" y="38" width="48" height="44" rx="8" fill="#03120F" stroke="#10B981" stroke-width="1.8" filter="url(#coreGlow)"/>

  <!-- Linux Terminal Prompt Glyph (>_) in Vivid Emerald & Amber -->
  <!-- Prompt Angle > -->
  <path d="M44 49 L53 56 L44 63" 
        fill="none" 
        stroke="url(#emeraldStroke)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Terminal Cursor _ (Pramana Active Core) -->
  <line x1="58" y1="63" x2="74" y2="63" 
        stroke="url(#amberGlow)" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- AI Pulsing Microchip Status Dot -->
  <circle cx="74" cy="48" r="2.5" fill="#F59E0B">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
