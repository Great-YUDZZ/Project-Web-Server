# ==============================================================================
# Konfigurasi Nginx Server Block - Website Portofolio Siswa TKJ (LEMP Stack)
# Lokasi File Asli: /var/www/project_tkj_yuda2/nginx/project_tkj_yuda2.conf
# Target Deployment: /etc/nginx/sites-available/project_tkj_yuda2
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yuda.local localhost 127.0.0.1 _;
    root /var/www/project_tkj_yuda2/public;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php index.html;
    charset utf-8;

    # Maximum file upload size (topologi images)
    client_max_body_size 20M;

    # Routing Laravel (Front Controller Pattern)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Logging optimizations
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # FastCGI PHP-FPM 8.4 Integration
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Static Assets Caching (Vite build, Images, Fonts)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Deny access to hidden dotfiles (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
